name: CI

# Runs on every push to main and every PR targeting main. The "deploy" job
# only fires on a push to main (not PRs) and only after "typecheck" passes.
#
# worker/ and client/ each have their own Vitest suite ("npm test") alongside
# typecheck — see e.g. worker/src/services/ResumeService.test.ts and
# client/src/utils/atsCheck.test.ts. (There used to be a third, server/,
# mirroring worker/'s tests on Node+Express+Postgres — it was retired and
# deleted since only worker/ was ever actually deployed; see git history
# before this commit if you ever need to reference it.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            client/package-lock.json

      # worker/ depends on this via a `file:../shared` reference (see
      # shared/package.json) — has to be built before it can resolve it.
      # worker's own npm scripts also have prebuild/predeploy/pretypecheck
      # hooks that redo this, so this step is really just making the first,
      # explicit build fast and visible in the log; the per-project hooks
      # below are what make it actually safe even if someone reorders these
      # steps later.
      - name: Build shared types package
        run: npm install --prefix shared && npm run build --prefix shared

      - name: worker — install, typecheck & test
        run: |
          npm ci --prefix worker
          npm run typecheck --prefix worker
          npm run test --prefix worker

      - name: client — install, typecheck, test & build
        run: |
          npm ci --prefix client
          npm run typecheck --prefix client
          npm run test --prefix client
          npm run build --prefix client

  deploy:
    needs: typecheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            client/package-lock.json

      - name: Build shared types package
        run: npm install --prefix shared && npm run build --prefix shared

      - name: Build client
        run: npm ci --prefix client && npm run build --prefix client

      - name: Deploy worker
        run: npm ci --prefix worker && npm run deploy --prefix worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
